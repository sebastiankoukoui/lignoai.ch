<script>
const ASSETS={"plan": "ausgangsplan.png", "viewer": "viewer.html", "cadwork": "IMW_LignoBuilders_mit_Referenzplan.3d", "cadMegabytes": "4.0"};
const COPY={"de": {"private": "Demo aus der Entwicklung", "title": "Vom Grundriss zum Holzbaumodell.", "lead": "Ein vorhandener 2D-Plan und eine Beschreibung der Konstruktion. Daraus entsteht mit LignoBuilders im Dialog ein parametrisch aufgebautes Modell mit zwei Geschossen.", "view": "Modell erkunden", "inputButton": "So ist die Demo entstanden", "floors": "Geschosse", "parts": "Bauteile", "fromOneModel": "aus einem Modell", "editable": "bearbeitbare Datei", "step1": "01 · Ausgangspunkt", "planTitle": "Ein bestehender Grundriss", "planIntro": "Als Grundlage dient ein Grundriss aus der integralen Holzbauplanung. Seine Kontur, Öffnungen und Raumaufteilung wurden für diese Demo ausgewertet.", "planCaption": "Linienauszug des ursprünglichen EG-Plans. Die Konstruktion der Demo verwendet bewusst vereinfachte Wandaufbauten.", "sourceLabel": "Grundlage", "source": "2D-Grundriss im DXF-Format aus dem IMW-Studienprojekt", "systemLabel": "Konstruktion", "system": "Aussen- und Innenwände in Holzrahmenbau mit Kerto-Kopf und CLT-Decken", "outputLabel": "Ergebnis", "output": "Interaktives Modell, abgeleitete 2D-Schnitte und bearbeitbare Cadwork-Datei", "step2": "02 · Die Eingabe", "promptTitle": "Die Konstruktion beschreiben", "paraphrase": "Zusammengefasste und sprachlich überarbeitete Eingabe aus dem tatsächlichen Dialog.", "prompt": "Nutze den IMW-Grundriss als Grundlage. Erzeuge zunächst die Aussenwände und ergänze die Innenwände in Holzrahmenbau.\n\nSetze das Gebäude auf eine Betonplatte und zeige einen Sockelanschluss. Lege darüber eine durchgehende CLT-Platte, die auch auf den Innenwänden voll aufliegt.\n\nKopiere das Geschoss darüber. Verwende dort Geschossanschlüsse ohne Sockeldetail und die Kerto-Kopfvariante mit Unterzügen über den grossen Fenstern. Zeige das Ergebnis in 3D und leite 2D-Pläne daraus ab.", "refineTitle": "Im Dialog weiterentwickelt", "refine": "Anschliessend wurden Innenwandecken, zwei Ständerlaschen-Anschlüsse je Geschoss und die Flucht am Treppenhaus präzisiert. Der fertige Stand wird hier gezeigt. Die Konstruktion wurde mit LignoBuilders berechnet. Diese Seite zeigt das fertige Ergebnis.", "step3": "03 · Das Ergebnis", "modelTitle": "Das generierte Haus erkunden", "controls": "Drehen, zoomen, Geschosse und Schichten wählen.", "viewerCaption": "Die 3D-Ansicht und die 2D-Schnitte zeigen denselben generierten Modellstand. Die Bedienelemente im Modell sind in dieser Demo auf Deutsch.", "prototype": "LignoBuilders ist in Entwicklung. Diese Demo zeigt einen überprüften Entwurfsstand und ist keine Fertigungsfreigabe.", "detailsTitle": "Einordnung des gezeigten Modellstands", "details": "Das Obergeschoss übernimmt den EG-Grundriss. Die Innenwandstärken sind vereinheitlicht. Das Sockeldetail wird separat gezeigt. Weitere Anschlüsse, Treppenöffnung und Verbindungsmittel gehören zur weiteren Ausarbeitung. CLT und Kerto sind nicht bemessen. Die Geometrie wurde offline geprüft und die nativen Cadwork-Körper wurden nachgemessen.", "step4": "04 · In Cadwork weiterarbeiten", "cadTitle": "Mehr als eine Ansicht", "cadIntro": "Die Demo steht als native .3d-Datei zum Öffnen und Weiterbearbeiten in Cadwork bereit.", "cad1": "Einzelne Stäbe und Platten mit Namen, Materialien und Baugruppen", "cad2": "Originale 2D-Planlinien deckungsgleich bei −1,00 m unter Beton-OK", "cad3": "Szenen für Geschosse, Gesamtmodell und Planvergleich", "download": "Cadwork-Datei herunterladen", "cadCaption": "Das ist die erzeugte Modelldatei. Builder-Code und Konstruktionsbibliothek sind nicht Bestandteil der Freigabe.", "footer": "LignoBuilders · Coming soon · Eine Demonstration von LignoAI", "fullscreen": "Vollbild"}, "fr": {"private": "Démonstration en développement", "title": "Du plan au modèle de construction bois.", "lead": "Un plan 2D existant et une description de la construction. LignoBuilders permet de développer, par le dialogue, un modèle paramétrique sur deux niveaux.", "view": "Explorer le modèle", "inputButton": "Comment cette démonstration a été créée", "floors": "niveaux", "parts": "éléments", "fromOneModel": "issus du même modèle", "editable": "fichier modifiable", "step1": "01 · Le point de départ", "planTitle": "Un plan existant", "planIntro": "La base est un plan issu d’un projet d’étude en planification intégrale de construction bois. Son contour, ses ouvertures et la répartition des pièces ont été analysés pour cette démonstration.", "planCaption": "Extrait des lignes du plan original du rez-de-chaussée. La démonstration utilise des compositions de parois simplifiées.", "sourceLabel": "Base", "source": "Plan 2D au format DXF du projet d’étude IMW", "systemLabel": "Construction", "system": "Parois extérieures et intérieures à ossature bois, tête de paroi en Kerto et planchers CLT", "outputLabel": "Résultat", "output": "Modèle interactif, coupes 2D dérivées et fichier Cadwork modifiable", "step2": "02 · La demande", "promptTitle": "Décrire la construction", "paraphrase": "Demande résumée et reformulée à partir du dialogue réel.", "prompt": "Utilisez le plan IMW comme base. Générez d’abord les parois extérieures, puis ajoutez les parois intérieures à ossature bois.\n\nPlacez le bâtiment sur une dalle en béton et montrez un détail de pied de paroi. Ajoutez une dalle CLT continue, également en appui complet sur les parois intérieures.\n\nCopiez ce niveau au-dessus. Utilisez des raccords d’étage sans détail de soubassement et la variante de tête en Kerto avec poutres au-dessus des grandes fenêtres. Présentez le résultat en 3D et dérivez les plans 2D.", "refineTitle": "Affiné par le dialogue", "refine": "Les angles des parois intérieures, deux raccords par tasseau de liaison par niveau et l’alignement près de la cage d’escalier ont ensuite été précisés. Cet aperçu présente le résultat généré avec les LignoBuilders.", "step3": "03 · Le résultat", "modelTitle": "Explorer le bâtiment généré", "controls": "Tourner, zoomer, choisir les niveaux et les couches.", "viewerCaption": "La vue 3D et les coupes 2D présentent le même état du modèle. Les commandes du visualiseur sont en allemand dans cette démonstration.", "prototype": "LignoBuilders est en développement. Cette démonstration présente un état d’avant-projet vérifié, sans validation pour la fabrication.", "detailsTitle": "Précisions sur le modèle présenté", "details": "L’étage reprend le plan du rez-de-chaussée. Les épaisseurs des parois intérieures sont uniformisées. Le détail de pied est présenté séparément. D’autres raccords, l’ouverture d’escalier et les assemblages restent à détailler. Le CLT et le Kerto ne sont pas dimensionnés. La géométrie a été vérifiée hors ligne et les volumes natifs de Cadwork ont été mesurés.", "step4": "04 · Poursuivre dans Cadwork", "cadTitle": "Plus qu’une visualisation", "cadIntro": "La démonstration est disponible sous forme de fichier natif .3d à ouvrir et modifier dans Cadwork.", "cad1": "Barres et panneaux individuels avec noms, matériaux et groupes", "cad2": "Lignes originales du plan 2D superposées à −1,00 m sous le dessus du béton", "cad3": "Scènes pour les niveaux, le modèle complet et la comparaison avec le plan", "download": "Télécharger le fichier Cadwork", "cadCaption": "Il s’agit du modèle généré. Le code des builders et la bibliothèque de construction ne font pas partie du partage.", "footer": "LignoBuilders · Coming soon · Une démonstration de LignoAI", "fullscreen": "Plein écran"}, "it": {"private": "Demo in sviluppo", "title": "Dalla pianta al modello in legno.", "lead": "Una pianta 2D esistente e una descrizione della costruzione. Con LignoBuilders, il dialogo porta a un modello parametrico su due piani.", "view": "Esplora il modello", "inputButton": "Come è nata questa demo", "floors": "piani", "parts": "elementi", "fromOneModel": "dallo stesso modello", "editable": "file modificabile", "step1": "01 · Il punto di partenza", "planTitle": "Una pianta esistente", "planIntro": "La base è una pianta di un progetto di studio di pianificazione integrale delle costruzioni in legno. Il contorno, le aperture e la distribuzione dei locali sono stati analizzati per questa demo.", "planCaption": "Estratto delle linee della pianta originale del piano terra. La demo utilizza composizioni delle pareti semplificate.", "sourceLabel": "Base", "source": "Pianta 2D in formato DXF del progetto di studio IMW", "systemLabel": "Costruzione", "system": "Pareti esterne e interne a telaio in legno, testa in Kerto e solai CLT", "outputLabel": "Risultato", "output": "Modello interattivo, sezioni 2D derivate e file Cadwork modificabile", "step2": "02 · La richiesta", "promptTitle": "Descrivere la costruzione", "paraphrase": "Richiesta riassunta e riformulata a partire dal dialogo effettivo.", "prompt": "Usa la pianta IMW come base. Genera prima le pareti esterne e aggiungi le pareti interne a telaio in legno.\n\nPosiziona l’edificio su una platea in calcestruzzo e mostra un dettaglio di attacco alla base. Aggiungi una lastra CLT continua, in appoggio completo anche sulle pareti interne.\n\nCopia il piano sopra. Usa raccordi di piano senza dettaglio di zoccolo e la variante di testa in Kerto con travi sopra le grandi finestre. Mostra il risultato in 3D e ricavane le tavole 2D.", "refineTitle": "Perfezionato nel dialogo", "refine": "Sono poi stati precisati gli angoli delle pareti interne, due raccordi con listello di collegamento per piano e l’allineamento vicino al vano scala. Qui viene mostrato il risultato generato con i LignoBuilders.", "step3": "03 · Il risultato", "modelTitle": "Esplora l’edificio generato", "controls": "Ruota, ingrandisci, scegli i piani e gli strati.", "viewerCaption": "La vista 3D e le sezioni 2D mostrano lo stesso stato del modello. In questa demo i comandi del visualizzatore sono in tedesco.", "prototype": "LignoBuilders è in sviluppo. Questa demo mostra uno stato di progetto verificato, senza approvazione per la produzione.", "detailsTitle": "Precisazioni sul modello mostrato", "details": "Il piano superiore riprende la pianta del piano terra. Gli spessori delle pareti interne sono uniformati. Il dettaglio alla base è mostrato separatamente. Altri raccordi, il foro della scala e i collegamenti richiedono un ulteriore sviluppo. CLT e Kerto non sono dimensionati. La geometria è stata verificata offline e i volumi nativi di Cadwork sono stati misurati.", "step4": "04 · Proseguire in Cadwork", "cadTitle": "Più di una visualizzazione", "cadIntro": "La demo è disponibile come file nativo .3d da aprire e modificare in Cadwork.", "cad1": "Travi e pannelli individuali con nomi, materiali e gruppi", "cad2": "Linee originali della pianta 2D allineate a −1,00 m sotto il piano superiore del calcestruzzo", "cad3": "Scene per i piani, il modello completo e il confronto con la pianta", "download": "Scarica il file Cadwork", "cadCaption": "Questo è il modello generato. Il codice dei builder e la libreria costruttiva non fanno parte della condivisione.", "footer": "LignoBuilders · Coming soon · Una demo di LignoAI", "fullscreen": "Schermo intero"}, "en": {"private": "Development demo", "title": "From floor plan to timber model.", "lead": "An existing 2D plan and a description of the construction. With LignoBuilders, an iterative conversation develops a parametrically built model with two storeys.", "view": "Explore the model", "inputButton": "How this demo was created", "floors": "storeys", "parts": "components", "fromOneModel": "from one model", "editable": "editable file", "step1": "01 · The starting point", "planTitle": "An existing floor plan", "planIntro": "The starting point is a floor plan from an integrated timber construction study project. Its outline, openings and room layout were analysed for this demo.", "planCaption": "Line extract from the original ground-floor plan. The demo uses deliberately simplified wall build-ups.", "sourceLabel": "Source", "source": "2D floor plan in DXF format from the IMW study project", "systemLabel": "Construction", "system": "External and internal timber frame walls with Kerto wall heads and CLT floors", "outputLabel": "Result", "output": "Interactive model, derived 2D sections and an editable Cadwork file", "step2": "02 · The input", "promptTitle": "Describe the construction", "paraphrase": "A condensed and reworded version of the input from the actual conversation.", "prompt": "Use the IMW floor plan as the starting point. Generate the external walls first, then add the internal timber frame walls.\n\nPlace the building on a concrete slab and show a wall base detail. Add a continuous CLT slab with full bearing on the internal walls as well.\n\nCopy this storey above. Use inter-storey connections without a base detail and the Kerto wall-head variant with beams above the large windows. Show the result in 3D and derive 2D drawings from it.", "refineTitle": "Refined through conversation", "refine": "The internal wall corners, two connection battens per storey and the alignment beside the staircase were then refined. This preview shows the resulting model generated with LignoBuilders.", "step3": "03 · The result", "modelTitle": "Explore the generated building", "controls": "Rotate, zoom and select storeys and layers.", "viewerCaption": "The 3D view and 2D sections show the same generated model. The model controls are in German in this demo.", "prototype": "LignoBuilders is in development. This demo presents a checked design model and is not approved for fabrication.", "detailsTitle": "About the model shown", "details": "The upper storey repeats the ground-floor layout. Internal wall thicknesses are standardised. The base detail is shown separately. Further junctions, the stair opening and fasteners require further detailing. CLT and Kerto have not been structurally designed. Geometry was checked offline and the native Cadwork solids were measured.", "step4": "04 · Continue in Cadwork", "cadTitle": "More than a visualisation", "cadIntro": "The demo is available as a native .3d file to open and edit in Cadwork.", "cad1": "Individual beams and panels with names, materials and groups", "cad2": "Original 2D plan lines aligned at −1.00 m below the top of the concrete", "cad3": "Scenes for the storeys, the complete model and plan comparison", "download": "Download the Cadwork file", "cadCaption": "This is the generated model file. The builder source code and construction library are not part of the shared content.", "footer": "LignoBuilders · Coming soon · A demonstration by LignoAI", "fullscreen": "Full screen"}};
