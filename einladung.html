<body><header><a href="/"><img src="/assets/lignoai-wordmark.webp" width="180" height="38" alt="LignoAI"></a><select id="language" aria-label="Sprache"><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="en">English</option></select></header>
